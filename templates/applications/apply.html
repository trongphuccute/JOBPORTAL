{% extends 'base/base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/apply_job.css' %}">

<section class="apply-page">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-10">

                <div class="apply-card">

                    <!-- TOP -->

                    <div class="apply-header">

                        <div>

                            <span class="apply-badge">
                                APPLY NOW
                            </span>

                            <h1>
                                Apply Job
                            </h1>

                            <p>
                                Submit your resume for this opportunity
                            </p>

                        </div>

                        <div class="apply-icon">
                            📄
                        </div>

                    </div>

                    <!-- JOB INFO -->

                    <div class="job-preview">

                        <div class="job-logo">
                            {{ job.company.name|first }}
                        </div>

                        <div>

                            <h3>
                                {{ job.title }}
                            </h3>

                            <p>
                                🏢 {{ job.company.name }}
                            </p>

                        </div>

                    </div>

                    <!-- FORM -->

                    <form method="POST"
                          enctype="multipart/form-data"
                          class="apply-form">

                        {% csrf_token %}

                        <div class="upload-box">

                            <div class="upload-icon">
                                ☁️
                            </div>

                            <h5>
                                Upload Your CV
                            </h5>

                            <p>
                                PDF, DOC, DOCX accepted
                            </p>

                            <input type="file"
                                   name="file"
                                   required
                                   class="form-control">

                        </div>

                        <button type="submit"
                                class="apply-btn">

                            🚀 Submit Application

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
