{% extends "admin/base_site.html" %}

{% block content %}

<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">

    <div class="bg-green-600 text-white p-6 rounded-3xl shadow-lg">
        <h2 class="text-lg font-semibold">
            Total Jobs
        </h2>

        <p class="text-4xl font-bold mt-3">
            {{ total_jobs }}
        </p>
    </div>

    <div class="bg-blue-600 text-white p-6 rounded-3xl shadow-lg">
        <h2 class="text-lg font-semibold">
            Users
        </h2>

        <p class="text-4xl font-bold mt-3">
            {{ total_users }}
        </p>
    </div>

    <div class="bg-purple-600 text-white p-6 rounded-3xl shadow-lg">
        <h2 class="text-lg font-semibold">
            Applications
        </h2>

        <p class="text-4xl font-bold mt-3">
            {{ total_applications }}
        </p>
    </div>

    <div class="bg-orange-600 text-white p-6 rounded-3xl shadow-lg">
        <h2 class="text-lg font-semibold">
            Employers
        </h2>

        <p class="text-4xl font-bold mt-3">
            {{ total_employers }}
        </p>
    </div>

</div>

<div class="bg-white dark:bg-gray-900 p-6 rounded-3xl shadow-lg">

    <h2 class="text-2xl font-bold mb-6">
        Applications Analytics
    </h2>

    <canvas id="analyticsChart"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('analyticsChart');

new Chart(ctx, {

    type: 'line',

    data: {

        labels: [
            'Jan',
            'Feb',
            'Mar',
            'Apr',
            'May',
            'Jun'
        ],

        datasets: [{

            label: 'Applications',

            data: [12, 19, 7, 15, 22, 30],

            tension: 0.4,

            fill: true,
        }]
    }
});

</script>

{% endblock %}
